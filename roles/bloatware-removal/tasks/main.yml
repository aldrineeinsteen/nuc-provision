- name: Add comment header to hosts file blocked entries
  community.windows.win_lineinfile:
    path: C:\Windows\System32\drivers\etc\hosts
    line: "# Blocked by parental controls - managed by Ansible"
    insertbefore: "127.0.0.1 bloxd.io"
    create: no
    state: present

- name: Uninstall bloxd.io and gaming browser extensions
  ansible.windows.win_shell: |
    $removed = @()
    
    # Remove bloxd.io PWA (Progressive Web App) if installed
    $bloxdPaths = @(
      "$env:LOCALAPPDATA\Programs\bloxd",
      "$env:LOCALAPPDATA\bloxd.io",
      "$env:APPDATA\bloxd.io"
    )
    
    foreach ($path in $bloxdPaths) {
      if (Test-Path $path) {
        Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
        $removed += "Removed bloxd.io app from: $path"
      }
    }
    
    # Remove from Chrome extensions and PWAs
    Get-ChildItem "C:\Users\*\AppData\Local\Google\Chrome\User Data\Default\Extensions" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
      if ($_.Name -like "*bloxd*" -or $_.Name -like "*roblox*" -or $_.Name -like "*game*") {
        Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
        $removed += "Chrome extension: $($_.Name)"
      }
    }
    
    # Remove Chrome PWAs (Web Apps)
    Get-ChildItem "C:\Users\*\AppData\Local\Google\Chrome\User Data\Default\Web Applications" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
      $manifestPath = Join-Path $_.FullName "Manifest"
      if (Test-Path $manifestPath) {
        $content = Get-Content $manifestPath -Raw -ErrorAction SilentlyContinue
        if ($content -match "bloxd|roblox") {
          Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
          $removed += "Chrome PWA: $($_.Name)"
        }
      }
    }
    
    # Remove from Edge extensions and PWAs
    Get-ChildItem "C:\Users\*\AppData\Local\Microsoft\Edge\User Data\Default\Extensions" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
      if ($_.Name -like "*bloxd*" -or $_.Name -like "*roblox*" -or $_.Name -like "*game*") {
        Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
        $removed += "Edge extension: $($_.Name)"
      }
    }
    
    # Remove from Firefox extensions (already blocked by firefox-lockdown role, but clean up existing)
    Get-ChildItem "C:\Users\*\AppData\Roaming\Mozilla\Firefox\Profiles\*\extensions" -ErrorAction SilentlyContinue | ForEach-Object {
      if ($_.Name -match "bloxd|roblox") {
        Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
        $removed += "Firefox extension: $($_.Name)"
      }
    }
    
    # Clear all gaming-related shortcuts from desktop and start menu
    $shortcuts = @("*bloxd*", "*roblox*", "*game*", "*krunker*", "*now.gg*")
    foreach ($pattern in $shortcuts) {
      # Desktop shortcuts
      Get-ChildItem "C:\Users\*\Desktop" -Filter "$pattern.lnk" -ErrorAction SilentlyContinue | ForEach-Object {
        Remove-Item -Path $_.FullName -Force -ErrorAction SilentlyContinue
        $removed += "Desktop shortcut: $($_.Name)"
      }
      Get-ChildItem "C:\Users\*\Desktop" -Filter "$pattern.url" -ErrorAction SilentlyContinue | ForEach-Object {
        Remove-Item -Path $_.FullName -Force -ErrorAction SilentlyContinue
        $removed += "Desktop URL: $($_.Name)"
      }
      
      # Start Menu shortcuts
      Get-ChildItem "C:\Users\*\AppData\Roaming\Microsoft\Windows\Start Menu\Programs" -Filter "$pattern*" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
        Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
        $removed += "Start Menu: $($_.Name)"
      }
    }
    
    if ($removed.Count -gt 0) {
      Write-Output "Removed items: $($removed -join ', ')"
    } else {
      Write-Output "No gaming extensions or apps found"
    }
  register: extension_removal
  changed_when: extension_removal.stdout | default('') | regex_search('Removed items') | bool

- name: Flush DNS cache to apply hosts file changes
  ansible.windows.win_shell: |
    ipconfig /flushdns
    Write-Output "DNS cache flushed successfully"
  changed_when: false

